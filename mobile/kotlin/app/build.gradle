apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

def configValue = { key, fallback ->
    System.getenv(key) ?: localProps.getProperty(key) ?: fallback
}

android {
    namespace 'com.waaba.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.waaba.mobile'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        buildConfigField 'String', 'SUPABASE_URL', "\"${configValue('SUPABASE_URL', 'https://fhagzeiqewwgrczlczlj.supabase.co')}\""
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', "\"${configValue('SUPABASE_PUBLISHABLE_KEY', 'sb_publishable_-rMeJCZjT9r-9ChrMhrs2g_-Vov1TXW')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
